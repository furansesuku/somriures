<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Somriures - Riuada de nassos</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="wrap">
    <div class="hud">
      <span id="score">Rialles: 0</span>
      <span id="time">Temps: 30s</span>
    </div>

    <div class="stage">
      <canvas id="cv" width="600" height="450"></canvas>

      <div class="overlay" id="ov">
        <h1 id="title">Somriures</h1>
        <p class="tag">#Riuadadenassos</p>
        <p class="msg" id="msg">Atrapa tots els nassos que puguis abans que s'acabi el temps.</p>
        <p class="resultat" id="resultat" hidden></p>
        <button id="btn">Començar!</button>
        <a class="boto boto-apadrinar" id="apadrinar" href="#" target="_blank" rel="noopener" hidden>Apadrina un Pallapupa</a>
      </div>
    </div>
    <img class="logos" src="logos.png" alt="#Riuadadenassos - Pallapupas">
  </main>

  <script src="juego.js"></script>
</body>
</html>
