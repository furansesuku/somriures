<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Somriures - Riuada de nassos</title>
  <link rel="stylesheet" href="style.css?v=9">
</head>
<body>
  <main class="wrap">
    <div class="hud">
      <span id="rialles">Rialles: 0</span>
      <span id="score">Punts: 0</span>
      <span id="time">Temps: 30s</span>
    </div>

    <div class="stage">
      <canvas id="cv" width="600" height="800" style="aspect-ratio:auto"></canvas>

      <div class="overlay" id="ov">
        <div class="panel">
          <h1 id="title">Somriures</h1>
          <p class="tag">#Riuadadenassos</p>
          <p class="msg" id="msg">Atrapa tots els nassos que puguis abans que s'acabi el temps.</p>
          <p class="resultat" id="resultat" hidden></p>
          <p class="resultat resultat-punts" id="resultatPunts" hidden></p>
          <p class="conversio" id="conversio" hidden></p>
          <div class="guardar" id="guardar" hidden>
            <input id="nom" type="text" maxlength="12" placeholder="El teu nom" autocomplete="off" aria-label="El teu nom">
            <button id="btnGuardar" type="button">Desar</button>
          </div>
          <p class="estat-ranking" id="estatRanking" hidden></p>
          <a class="boto boto-apadrinar" id="apadrinar" href="https://www.stockcrowd.com/p2p/1799/Apadrinaunsomriure" target="_blank" rel="noopener" hidden>Apadrina un somriure</a>
          <button id="btn">Començar!</button>
        </div>
      </div>
    </div>

    <section class="ranking" id="rankingSec">
      <h2>Classificació</h2>
      <table class="ranking-taula">
        <thead><tr><th>#</th><th>Jugador</th><th>Punts</th></tr></thead>
        <tbody id="cosRanking"></tbody>
      </table>
      <p class="ranking-nota" id="notaRanking" hidden></p>
    </section>

    <img class="logos" src="logos.png" alt="#Riuadadenassos - Pallapupas">
  </main>

  <script src="juego.js?v=9"></script>
</body>
</html>
